<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodAI - Smart Recommendations</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-utensils"></i> FoodAI</h1>
            <p>Discover dishes tailored to your taste</p>
        </header>

        <div class="search-box">
            <form id="search-form">
                <input type="text" id="food-input" placeholder="What's your favorite dish?">
                <button type="submit">
                    <i class="fas fa-search"></i> Find Recommendations
                </button>
            </form>
        </div>

        <div class="results-section">
            <div id="results" class="food-grid"></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
